name: Update Badminton Coach Skill

on:
  # Permet de lancer la mise à jour à la demande d'un simple clic dans l'onglet "Actions" de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Générer output/skills.md depuis Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_IDS: ${{ secrets.NOTION_PAGE_IDS || secrets.NOTION_PAGE_ID }}
        run: python sync_coach.py

      - name: Committer et pousser le fichier mis à jour
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/skills.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: mise à jour des connaissances badminton depuis Notion" && git push)
